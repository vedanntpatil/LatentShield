<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LatentShield — PSIM Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen">

<!-- Persistent health bar -->
<header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
  <div class="max-w-[1600px] mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
    <div class="flex items-center gap-2">
      <i data-lucide="shield-check" class="w-6 h-6 text-cyan-400"></i>
      <span class="font-bold text-lg tracking-wide text-white">LatentShield</span>
      <span class="text-xs text-slate-500 hidden sm:inline">Physical Security &amp; Event Correlation</span>
    </div>
    <div id="health-bar" class="flex items-center gap-2 ml-auto flex-wrap"></div>
    <div id="conn-badge" class="flex items-center gap-1.5 text-xs px-2 py-1 rounded-full bg-slate-800">
      <span id="conn-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
      <span id="conn-text">connecting…</span>
    </div>
  </div>
</header>

<div class="max-w-[1600px] mx-auto flex">
  <!-- Sidebar -->
  <nav class="w-52 shrink-0 border-r border-slate-800 p-3 space-y-1 hidden md:block">
    <button data-page="overview" class="nav-btn w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-slate-800">
      <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
    </button>
    <button data-page="events" class="nav-btn w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-slate-800">
      <i data-lucide="radio" class="w-4 h-4"></i> Event Stream
    </button>
    <button data-page="incidents" class="nav-btn w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-slate-800">
      <i data-lucide="siren" class="w-4 h-4"></i> Incidents
    </button>
    <button data-page="dlq" class="nav-btn w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-slate-800">
      <i data-lucide="archive" class="w-4 h-4"></i> Dead-Letter Queue
    </button>
    <button data-page="telemetry" class="nav-btn w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-slate-800">
      <i data-lucide="line-chart" class="w-4 h-4"></i> Telemetry
    </button>
    <button data-page="controls" class="nav-btn w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-slate-800">
      <i data-lucide="sliders-horizontal" class="w-4 h-4"></i> Controls
    </button>
    <div class="pt-4 mt-4 border-t border-slate-800 text-xs text-slate-500 px-3">
      <div>Ingested: <span id="stat-ingested" class="text-slate-300">0</span></div>
      <div>Correlated: <span id="stat-correlated" class="text-slate-300">0</span></div>
      <div>Quarantined: <span id="stat-dlq" class="text-slate-300">0</span></div>
    </div>
  </nav>

  <!-- Mobile nav -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around py-2 z-40">
    <button data-page="overview" class="nav-btn text-xs flex flex-col items-center"><i data-lucide="layout-dashboard" class="w-5 h-5"></i>Home</button>
    <button data-page="events" class="nav-btn text-xs flex flex-col items-center"><i data-lucide="radio" class="w-5 h-5"></i>Events</button>
    <button data-page="incidents" class="nav-btn text-xs flex flex-col items-center"><i data-lucide="siren" class="w-5 h-5"></i>Alerts</button>
    <button data-page="dlq" class="nav-btn text-xs flex flex-col items-center"><i data-lucide="archive" class="w-5 h-5"></i>DLQ</button>
    <button data-page="telemetry" class="nav-btn text-xs flex flex-col items-center"><i data-lucide="line-chart" class="w-5 h-5"></i>Charts</button>
    <button data-page="controls" class="nav-btn text-xs flex flex-col items-center"><i data-lucide="sliders-horizontal" class="w-5 h-5"></i>Ctrl</button>
  </div>

  <!-- Pages -->
  <main class="flex-1 p-4 md:p-6 pb-20 md:pb-6 min-w-0">
    <section id="page-overview" class="page"></section>
    <section id="page-events" class="page hidden"></section>
    <section id="page-incidents" class="page hidden"></section>
    <section id="page-dlq" class="page hidden"></section>
    <section id="page-telemetry" class="page hidden"></section>
    <section id="page-controls" class="page hidden"></section>
  </main>
</div>

<!-- Raw payload diff modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-3xl w-full max-h-[80vh] overflow-auto">
    <div class="flex items-center justify-between p-4 border-b border-slate-800">
      <h3 class="font-semibold text-white">Canonical Event vs Raw Payload</h3>
      <button id="modal-close" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="p-4 grid md:grid-cols-2 gap-4">
      <div><div class="text-xs text-slate-500 mb-1">Canonical (normalized)</div><pre id="modal-canonical" class="text-xs bg-slate-950 rounded p-3 overflow-auto"></pre></div>
      <div><div class="text-xs text-slate-500 mb-1">Raw vendor payload</div><pre id="modal-raw" class="text-xs bg-slate-950 rounded p-3 overflow-auto"></pre></div>
    </div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/state.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/app.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
